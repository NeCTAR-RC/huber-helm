# Default values for huber.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


conf:
  debug: false
  keystone:
    auth_url:
    username: huber
    project_name: service
    memcached_servers: []
  notification:
    exchange: ceilometer
    topic: huber
  handlers:
    # List of handler entry-point names to load. Available out of the
    # box: "logging", "project_membership".
    enabled: []
  project_membership:
    subject: Nectar project role change
    tenantmanager_role: tenantmanager
    member_role: member
  sentry:
    environment: production

vault:
  role: k8s
  settings_secret: 'path/to/secret/in/vault'

notification:
  name: notification
  image:
    repository: registry.rc.nectar.org.au/nectar/huber
  command:
    - huber-notification
  replicaCount: 1
  pdb:
    enabled: false
    minAvailable: 1
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  # huber-notification runs a notification listener, not an RPC
  # server, so oslo.messaging's RPC ping endpoint is not available.
  # Instead check the pod holds an ESTABLISHED TCP connection to the
  # transport_url port, which catches a cotyledon service manager that
  # is running but spawned no consumer at all. Startup-only on
  # purpose: a liveness probe on the message bus would mass-restart
  # every worker during a RabbitMQ outage that oslo.messaging would
  # ride out by reconnecting; post-start wedges are left to
  # queue/consumer alerting. Requires nectarlib >= 4.4.0 to render.
  startupProbe:
    exec:
      command:
        - nectar-health-probe
        - "--project"
        - huber
        - amqp
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30


image:
  repository: registry.rc.nectar.org.au/nectar/huber
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL


autoscaling:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}
